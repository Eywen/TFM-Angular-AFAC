<div class="p-5">
<div class="p-2 row g-3 ">

  <div class="col-md-2 row">
    <button type="button" class="btn btn-primary" >Agregar guia</button>
  </div>
  <div class="col-md-4">
  </div>
  <div class="col-md-6 row" >
    <div class="col-md-6">
      <input class="form-control mr-sm-2" type="search" placeholder="Número de guia" aria-label="Search">
    </div>
    <div class="col-md-3" >
      <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
    </div>
  </div>

  <div class="p-4">
    <table class="table  table-striped">
      <thead>
        <tr>
          <th scope="col">Guia  </th>
          <th scope="col">Estado  </th>
          <th scope="col">Fecha entrada  </th>
          <th scope="col">Fecha cargue trabajador  </th>
          <th scope="col">Trabajador </th>
          <th scope="col">Cliente  </th>
          <th scope="col">  </th>
        </tr>
      </thead>
      <tbody>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td align="right">
          <div class="btn-group me-2" role="group" aria-label="First group">
            <button class="btn btn-info" ><i class="fa-solid fa-eye"></i> Ver</button>
          </div>
          <div class="btn-group me-2" role="group" aria-label="Second group">
            <button class="btn btn-warning" ><i class="fa-solid fa-pen-to-square"></i> Modificar</button>
          </div>
          <div class="btn-group" role="group" aria-label="Third group">
            <button type="button" class="btn btn-danger"
                    data-bs-toggle="modal"
                    data-bs-target="#customConfirmationModal"
                    >
              <i class="fa-solid fa-trash-can"></i>
              Eliminar
            </button>
          </div>
        </td>
      </tbody>
    </table>
  </div>

</div>
</div>
