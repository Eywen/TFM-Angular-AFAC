<ng-container *ngIf="!isAuthenticated()" >
<div clas = " bodyLogin" >
  <div class="login">
<!--      <div class="row span12 ">-->
        <div class="logo">
          <img class="logo_img" src="../assets/images/LOGO-blanco.png"/>
        </div>
    <h2 class="color_purple"> Inicio de sesión</h2>
<!--        <div class="col-3 text-center"></div>-->
<!--        <div class="col-6 07 p-5">-->
          <form class="form-horizontal" style="max-width: 30rem;" #loginForm="ngForm" (ngSubmit)="login()">


<!--                  <label for="email"> Email</label>-->
                  <input id="email"  type="text" class="form-control mybutton" [(ngModel)]="credentials.username" name="username" placeholder="Email" required >

<!--                <label for="password"> Contraseña</label>-->
                <input id="password"  type="password" class="form-control mybutton" [(ngModel)]="credentials.password" name="password" placeholder="Contaseña" required>

<!--              <div class="mb-3">-->
                  <button class="mybutton" [disabled]="!loginForm.form.valid"><h2> Login</h2></button>
<!--              </div>-->
          </form>
<!--        </div>-->
<!--        <div class="col-3 text-center"></div>-->
<!--      </div>-->
  </div>
</div>
</ng-container>
